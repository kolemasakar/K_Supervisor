name: Core Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - ".github/workflows/core-validation.yml"
      - "access/**"
      - "agent_factory/**"
      - "agents/**"
      - "examples/**"
      - "factory/**"
      - "integrations/**"
      - "ksupervisor/**"
      - "models/**"
      - "observability/**"
      - "persistence/**"
      - "policy/**"
      - "providers/**"
      - "provisioning/**"
      - "registry/**"
      - "release_manager/**"
      - "runtime/**"
      - "scheduler/**"
      - "service_api/**"
      - "schemas/**"
      - "supervisor/**"
      - "tools/**"
      - "workflows/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    name: Core Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pydantic>=2.10,<3" "pytest>=8.3,<10" "jsonschema>=4.23,<5" "pytest-cov>=6,<8" "build>=1.2,<2"
      - name: Compile Python sources
        run: python -m compileall -q access agent_factory agents examples factory integrations ksupervisor models observability persistence policy providers provisioning registry release_manager runtime scheduler service_api supervisor tools workflows
      - name: Test with coverage gate and resource-warning gate
        run: python -m pytest -q -W error::ResourceWarning --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel and smoke public CLI
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          k-supervisor version
          python -c "import ksupervisor; print(ksupervisor.__version__)"
