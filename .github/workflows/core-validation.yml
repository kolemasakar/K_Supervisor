name: Core Validation

permissions:
  contents: read

concurrency:
  group: core-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-validation.yml"
      - "access/**"
      - "agent_factory/**"
      - "agents/**"
      - "examples/**"
      - "factory/**"
      - "integrations/**"
      - "ksupervisor/**"
      - "models/**"
      - "observability/**"
      - "persistence/**"
      - "policy/**"
      - "providers/**"
      - "provisioning/**"
      - "registry/**"
      - "release_manager/**"
      - "runtime/**"
      - "scheduler/**"
      - "service_api/**"
      - "schemas/**"
      - "supervisor/**"
      - "tools/**"
      - "workflows/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements/**"

jobs:
  python-validation:
    name: Python ${{ matrix.python-version }} Validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            lock-file: "requirements/ci-py313.lock"
          - python-version: "3.14"
            lock-file: "requirements/ci-py314.lock"
    runs-on: [self-hosted, linux, arm64, k-supervisor-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Create isolated pinned CI environment
        run: |
          rm -rf .venv-ci
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check --only-binary=:all: "pip==26.2.1"
          .venv-ci/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r "${{ matrix.lock-file }}"
          echo "${GITHUB_WORKSPACE}/.venv-ci/bin" >> "${GITHUB_PATH}"
      - name: Verify pinned CI environment
        env:
          LOCK_FILE: ${{ matrix.lock-file }}
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          lock_path = Path(os.environ["LOCK_FILE"])
          expected = {}
          for raw in lock_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if "==" not in line:
                  raise SystemExit(f"non-exact lock entry: {line}")
              name, version = line.split("==", 1)
              expected[name.lower().replace("_", "-")] = version

          for name, expected_version in sorted(expected.items()):
              actual = importlib.metadata.version(name)
              if actual != expected_version:
                  raise SystemExit(
                      f"lock mismatch for {name}: expected {expected_version}, got {actual}"
                  )
          PY
      - name: Compile Python sources
        run: python -m compileall -q access agent_factory agents examples factory integrations ksupervisor models observability persistence policy providers provisioning registry release_manager runtime scheduler service_api supervisor tools workflows
      - name: Test with coverage gate and resource-warning gate
        run: |
          python -m pytest -q -W error::ResourceWarning --cov=. --cov-report=term-missing --cov-report=xml
          python -m coverage report --fail-under=80
      - name: Build wheel
        run: |
          rm -rf dist build k_supervisor.egg-info
          python -m build --wheel --no-isolation
      - name: Install wheel and smoke public CLI
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          k-supervisor version
          python -c "import ksupervisor; print(ksupervisor.__version__)"
      - name: Generate deterministic SPDX 2.3 SBOM
        env:
          LOCK_FILE: ${{ matrix.lock-file }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          WHEEL="$1"
          SOURCE_TIMESTAMP="$(git show -s --format=%ct HEAD)"
          python -m tools.sbom \
            --wheel "$WHEEL" \
            --lock-file "$LOCK_FILE" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --source-timestamp "${SOURCE_TIMESTAMP}" \
            --output "dist/k-supervisor-py${PYTHON_VERSION}.spdx.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(f"dist/k-supervisor-py{os.environ['PYTHON_VERSION']}.spdx.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          assert document["spdxVersion"] == "SPDX-2.3"
          assert document["dataLicense"] == "CC0-1.0"
          assert document["SPDXID"] == "SPDXRef-DOCUMENT"
          assert document["packages"]
          assert any(
              item["SPDXID"] == "SPDXRef-Package-k-supervisor"
              and item.get("checksums")
              for item in document["packages"]
          )
          PY
      - name: Scan runtime dependencies for known vulnerabilities
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python -m tools.vulnerability_scan \
            --sbom "dist/k-supervisor-py${PYTHON_VERSION}.spdx.json" \
            --allowlist security/vulnerability_allowlist.json \
            --output "dist/k-supervisor-py${PYTHON_VERSION}.vulnerabilities.json"

      - name: Installed wheel Phase 3 service and CLI smoke
        run: |
          cd /tmp
          python - <<'PY'
          import json
          import os
          import sqlite3
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.request import urlopen

          from ksupervisor.config import PlatformConfig
          from ksupervisor.service import build_service_runtime, create_service_host

          token = "phase3-wheel-smoke-token"
          os.environ["KSUP_SECRET__SERVICE_OWNER"] = token

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              db = root / "state.db"
              server_config = PlatformConfig(
                  state_db_path=str(db),
                  service_host={
                      "bind_host": "127.0.0.1",
                      "port": 0,
                      "workers": 2,
                      "principals": [{
                          "principal_id": "wheel-smoke",
                          "scopes": ["projects:read"],
                          "token_ref": {"uri": "secret://service/owner"},
                      }],
                  },
              )
              runtime = build_service_runtime(server_config)
              host = create_service_host(runtime)
              host.start()
              address, port = host.address
              base = f"http://{address}:{port}"

              with urlopen(base + "/healthz", timeout=3) as response:
                  assert response.status == 200
                  assert json.loads(response.read()) == {"status": "live"}
              with urlopen(base + "/readyz", timeout=3) as response:
                  assert response.status == 200
                  assert json.loads(response.read()) == {"status": "ready"}

              client_config = root / "client.json"
              client_config.write_text(json.dumps({
                  "service_client": {
                      "base_url": base,
                      "token_ref": {"uri": "secret://service/owner"},
                      "timeout_seconds": 3,
                  }
              }), encoding="utf-8")
              completed = subprocess.run(
                  ["k-supervisor", "projects", "list", "--config", str(client_config)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              assert json.loads(completed.stdout)["data"]["projects"] == []
              assert host.stop()

              connection = sqlite3.connect(db)
              try:
                  assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              finally:
                  connection.close()
          PY

      - name: Installed wheel Phase 4 repository Service/API and CLI smoke
        run: |
          cd /tmp
          python - <<'PY'
          import json
          import os
          import sqlite3
          import subprocess
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          from ksupervisor.config import PlatformConfig
          from ksupervisor.service import build_service_runtime, create_service_host
          from models.enums import ProjectLifecycleState, ProjectOperationalState, ProjectSpecStatus
          from models.project import Project, ProjectSpec

          token = "phase4-wheel-smoke-token"
          os.environ["KSUP_SECRET__SERVICE_OWNER"] = token
          now = datetime.now(timezone.utc)

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              db = root / "state.db"
              config = PlatformConfig(
                  state_db_path=str(db),
                  service_host={
                      "bind_host": "127.0.0.1",
                      "port": 0,
                      "workers": 2,
                      "principals": [{
                          "principal_id": "phase4-wheel-smoke",
                          "scopes": ["repository:read", "repository:bootstrap"],
                          "token_ref": {"uri": "secret://service/owner"},
                      }],
                  },
              )
              runtime = build_service_runtime(config)
              spec = ProjectSpec(
                  project_spec_id="PS_PHASE4_WHEEL",
                  project_id="P_PHASE4_WHEEL",
                  spec_version="1.0",
                  status=ProjectSpecStatus.APPROVED,
                  created_at=now,
                  updated_at=now,
                  approved_at=now,
                  name="Phase 4 Wheel Smoke",
                  short_name="phase4-wheel-smoke",
                  purpose="Validate installed-wheel repository operator surface.",
                  problem_statement="Repository bootstrap must run only through Service/API.",
                  project_type="AI",
                  success_criteria=("repository bootstrap succeeds",),
                  first_working_criteria=("repository is bootstrapped",),
                  documentation={"roadmap_required": True},
                  repository={
                      "repository_provider": "FILESYSTEM",
                      "repository_name": "phase4-wheel-smoke",
                      "repository_visibility": "PRIVATE",
                      "ci_required": False,
                      "provisioning": "AUTOMATABLE",
                  },
                  architecture={"architecture_style": "MODULAR"},
                  notifications={"primary_channel": "EMAIL"},
              )
              project = Project(
                  project_id=spec.project_id,
                  name=spec.name,
                  active_project_spec_id=spec.project_spec_id,
                  lifecycle_state=ProjectLifecycleState.APPROVED,
                  operational_state=ProjectOperationalState.ACTIVE,
                  created_at=now,
                  updated_at=now,
              )
              runtime.projects.register(project, spec)

              host = create_service_host(runtime)
              host.start()
              address, port = host.address
              base = f"http://{address}:{port}"
              client_config = root / "client.json"
              client_config.write_text(json.dumps({
                  "service_client": {
                      "base_url": base,
                      "token_ref": {"uri": "secret://service/owner"},
                      "timeout_seconds": 3,
                  }
              }), encoding="utf-8")

              status = subprocess.run(
                  ["k-supervisor", "repository", "status", spec.project_id, "--config", str(client_config)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              status_body = json.loads(status.stdout)
              assert status_body["data"]["repository"]["provider"] == "FILESYSTEM"

              first = subprocess.run(
                  [
                      "k-supervisor", "repository", "bootstrap", spec.project_id,
                      "--config", str(client_config),
                      "--idempotency-key", "phase4-wheel-bootstrap",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              first_body = json.loads(first.stdout)
              assert first_body["response"]["data"]["repository_bootstrap"]["status"] == "BOOTSTRAPPED"
              assert first_body["response"]["meta"]["idempotent_replay"] is False

              replay = subprocess.run(
                  [
                      "k-supervisor", "repository", "bootstrap", spec.project_id,
                      "--config", str(client_config),
                      "--idempotency-key", "phase4-wheel-bootstrap",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              replay_body = json.loads(replay.stdout)
              assert replay_body["response"]["meta"]["idempotent_replay"] is True
              assert host.stop()

              connection = sqlite3.connect(db)
              try:
                  assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              finally:
                  connection.close()
          PY

      - name: Installed wheel Phase 5 plugin package smoke
        run: |
          cd /tmp
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace

          from release_manager.chatgpt_plugin import ChatGPTPluginPreparationProfile

          cases = [
              {
                  "id": f"positive-{index:03d}",
                  "type": "positive",
                  "prompt": f"Run supported workflow {index}.",
                  "expected_behavior": "Use the packaged skill within declared permissions.",
                  "expected_result_shape": "project-defined response",
                  "dependencies": ["repo-tools"],
              }
              for index in range(1, 6)
          ] + [
              {
                  "id": f"negative-{index:03d}",
                  "type": "negative",
                  "prompt": f"Attempt unsafe workflow {index}.",
                  "expected_behavior": "Stop and surface the required owner/workspace action.",
                  "expected_result_shape": "explicit safe blocker",
                  "dependencies": [],
              }
              for index in range(1, 4)
          ]

          spec = SimpleNamespace(
              name="Phase 5 Wheel Smoke",
              short_name="phase5-wheel-smoke",
              purpose="Validate installed-wheel native plugin package generation.",
              problem_statement="Plugin packaging must work outside the source checkout.",
              success_criteria=("native plugin package is deterministic",),
              release={
                  "chatgpt_plugin": {
                      "plugin_name": "phase5-wheel-smoke",
                      "registered_apps": [{
                          "alias": "repo-tools",
                          "app_id": "asdk_app_phase5_wheel_smoke",
                          "required": True,
                      }],
                      "package_references": [{
                          "source": "docs/REFERENCE.md",
                          "destination": "reference.md",
                          "required": True,
                      }],
                      "custom_action_dependencies": ["legacy-action"],
                      "mcp_integrations": ["legacy-mcp"],
                      "public_submission_ready": True,
                      "regression_cases": cases,
                      "github_marketplace": {
                          "enabled": True,
                          "name": "phase5-wheel-marketplace",
                          "plugin_id": "plugin_existing_phase5_wheel",
                      },
                  }
              },
          )
          release = SimpleNamespace(release_id="REL_PHASE5_WHEEL", version="0.1.0")
          target = SimpleNamespace(target_type="CHATGPT_PLUGIN")
          profile = ChatGPTPluginPreparationProfile()
          generated = profile.generate(
              spec,
              release,
              target,
              reference_contents={"docs/REFERENCE.md": "# Installed-wheel reference\n"},
          )

          paths = tuple(item.path for item in generated)
          assert profile.validate(paths) == ()
          assert not any(path.endswith("/mcp.json") or path.endswith("/.mcp.json") for path in paths)

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              for item in generated:
                  destination = root / item.path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_text(item.content, encoding="utf-8")

              package = root / "release" / "chatgpt_plugin" / "package"
              manifest = json.loads((package / "plugin.json").read_text(encoding="utf-8"))
              apps = json.loads((package / ".app.json").read_text(encoding="utf-8"))
              inventory = json.loads(
                  (root / "release" / "chatgpt_plugin" / "MIGRATION_INVENTORY.json").read_text(
                      encoding="utf-8"
                  )
              )
              regression = json.loads(
                  (root / "release" / "chatgpt_plugin" / "REGRESSION_CASES.json").read_text(
                      encoding="utf-8"
                  )
              )
              catalog = json.loads(
                  (
                      root
                      / "release"
                      / "chatgpt_plugin"
                      / "marketplace"
                      / ".agents"
                      / "plugins"
                      / "marketplace.json"
                  ).read_text(encoding="utf-8")
              )

              assert manifest["name"] == "phase5-wheel-smoke"
              assert manifest["version"] == "0.1.0"
              assert manifest["extensions"]["com.openai"]["apps"] == "./.app.json"
              assert "pluginId" not in manifest
              assert apps["apps"]["repo-tools"]["required"] is True
              assert inventory["custom_actions"][0]["status"] == "REBUILD_REQUIRED"
              assert inventory["mcp_integrations"][0]["status"] == "EXPLICIT_MAPPING_REQUIRED"
              assert inventory["selected_model"] == {"pinned": False, "transferred": False}
              assert inventory["sharing_access"]["transferred"] is False
              assert regression["public_submission_ready"] is True
              assert len(regression["cases"]) == 8
              assert catalog["plugins"][0]["pluginId"] == "plugin_existing_phase5_wheel"
              assert (
                  package
                  / "skills"
                  / "phase5-wheel-smoke"
                  / "references"
                  / "reference.md"
              ).read_text(encoding="utf-8") == "# Installed-wheel reference\n"
          PY


      - name: Installed wheel Phase 6 observability and supply-chain smoke
        run: |
          cd /tmp
          python - <<'PY'
          import io
          import json
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          from observability import (
              BoundedExporterSupervisor,
              ProductionMetricRegistry,
              StructuredLogger,
          )
          from tools.sbom import (
              ResolvedPackage,
              build_spdx_document,
              validate_spdx_document,
          )
          from tools.vulnerability_scan import scan

          sink = io.StringIO()
          logger = StructuredLogger(sink)
          assert logger.emit(
              event_name="service.request.completed",
              component="phase6-wheel-smoke",
              status="200",
              duration_ms=12.5,
              correlation_id="corr-phase6-wheel",
              request_id="req-phase6-wheel",
              attributes={
                  "method": "GET",
                  "route": "/healthz",
                  "status_class": "2xx",
              },
          )
          line = json.loads(sink.getvalue())
          assert line["event_name"] == "service.request.completed"
          assert line["attributes"]["route"] == "/healthz"

          metrics = ProductionMetricRegistry()
          metrics.record_service_request("GET", "/healthz", 200, 12.5)
          rendered = metrics.render_prometheus()
          assert "ksupervisor_service_requests_total" in rendered
          assert 'route="/healthz"' in rendered

          class Exporter:
              def __init__(self):
                  self.batches = []

              def export(self, records, *, timeout_seconds):
                  assert timeout_seconds == 1.0
                  self.batches.append(tuple(records))

          exporter = Exporter()
          supervisor = BoundedExporterSupervisor(
              "otlp_http",
              exporter,
              queue_size=2,
              batch_size=2,
              timeout_seconds=1.0,
              max_retries=0,
              metrics=metrics,
          )
          assert supervisor.enqueue({"event": "one"})
          assert supervisor.enqueue({"event": "two"})
          assert not supervisor.enqueue({"event": "three"})
          snapshot = supervisor.flush()
          assert snapshot.exported == 2
          assert snapshot.dropped == 1
          assert snapshot.queued == 0

          packages = {
              "k-supervisor": ResolvedPackage(
                  name="k-supervisor",
                  version="0.1.0",
                  requires=("pydantic",),
              ),
              "pydantic": ResolvedPackage(
                  name="pydantic",
                  version="2.12.5",
                  requires=(),
              ),
          }
          document = build_spdx_document(
              packages=packages,
              root_distribution="k-supervisor",
              wheel_sha256="a" * 64,
              repository="https://github.com/kolemasakar/K_Supervisor",
              commit="b" * 40,
              source_timestamp=1_700_000_000,
          )
          validate_spdx_document(document, root_distribution="k-supervisor")
          assert document["spdxVersion"] == "SPDX-2.3"

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              sbom = root / "sbom.json"
              allowlist = root / "allowlist.json"
              evidence_path = root / "vulnerabilities.json"
              sbom.write_text(
                  json.dumps(document, sort_keys=True),
                  encoding="utf-8",
              )
              allowlist.write_text(
                  json.dumps({"schema_version": 1, "exceptions": []}),
                  encoding="utf-8",
              )

              evidence = scan(
                  sbom=sbom,
                  allowlist=allowlist,
                  output=evidence_path,
                  now=datetime(2026, 9, 23, tzinfo=timezone.utc),
                  query=lambda name, version: {"vulns": []},
              )
              assert evidence["status"] == "CLEAN"
              assert evidence["input"]["package_count"] == 1
              assert json.loads(evidence_path.read_text(encoding="utf-8"))["status"] == "CLEAN"
          PY

  core-validation:
    name: Core Validation
    if: ${{ always() }}
    needs: python-validation
    runs-on: [self-hosted, linux, arm64, k-supervisor-ci]
    steps:
      - name: Require Python 3.13 and 3.14 validation
        env:
          PYTHON_VALIDATION_RESULT: ${{ needs.python-validation.result }}
        run: |
          echo "python_validation_result=${PYTHON_VALIDATION_RESULT}"
          test "${PYTHON_VALIDATION_RESULT}" = "success"
