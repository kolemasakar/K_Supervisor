name: Package Publish

on:
  workflow_dispatch:
    inputs:
      confirm_owner_publication:
        description: "Confirm that the owner explicitly authorizes package-index publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate package
    if: ${{ inputs.confirm_owner_publication == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish package to PyPI
    needs: build-and-validate
    if: ${{ inputs.confirm_owner_publication == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/k-supervisor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
