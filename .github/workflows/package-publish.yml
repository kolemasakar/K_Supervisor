name: Package Publish

on:
  workflow_dispatch:
    inputs:
      confirm_owner_publication:
        description: "Confirm that the owner explicitly authorizes package-index publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate package
    if: ${{ inputs.confirm_owner_publication == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish package to PyPI
    needs: build-and-validate
    if: ${{ inputs.confirm_owner_publication == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/k-supervisor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
