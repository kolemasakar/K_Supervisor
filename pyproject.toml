[project]
name = "k-supervisor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "jsonschema>=4.23,<5",
    "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 45
